name: Deploy Supabase (migrations + functions)

# Запускается вручную. Нужны секреты репозитория:
#   SUPABASE_ACCESS_TOKEN — персональный токен (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD  — пароль базы данных проекта
# и переменная SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
